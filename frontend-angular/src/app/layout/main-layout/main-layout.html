<div class="app-shell">
  <app-sidebar [class.sidebar-open]="isSidebarOpen" />

  @if (isSidebarOpen) {
    <button
      class="sidebar-overlay"
      type="button"
      aria-label="Close sidebar"
      (click)="closeSidebar()">
    </button>
  }

  <div class="main-column">
    <div class="mobile-header">
      <button
        class="mobile-menu-button"
        type="button"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="isSidebarOpen"
        (click)="toggleSidebar()">
        ☰
      </button>

      <app-navbar />
    </div>

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
