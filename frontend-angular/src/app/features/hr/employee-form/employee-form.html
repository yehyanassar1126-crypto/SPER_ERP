<div class="p-6 max-w-4xl mx-auto space-y-6">
  <!-- Top Navigation & Title -->
  <div class="flex items-center justify-between border-b border-gray-100 pb-4">
    <div>
      <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Enterprise HR</span>
      <h1 class="text-2xl font-bold text-gray-900">
        {{ isEditMode ? 'Edit Employee Details' : 'Add New Employee' }}
      </h1>
      <p class="text-sm text-gray-500">
        {{ isEditMode ? 'Update information for existing team member.' : 'Enter details to register a new employee.' }}
      </p>
    </div>
    <a routerLink="/employees" class="px-4 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm hover:bg-gray-50 font-medium transition-colors">
      Back to Directory
    </a>
  </div>

  <!-- Error Alert -->
  <div *ngIf="errorMessage" class="p-4 bg-red-50 text-red-600 rounded-lg border border-red-100 text-sm">
    {{ errorMessage }}
  </div>

  <!-- Form Container -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <form (ngSubmit)="onSubmit()" #empForm="ngForm" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Name Input -->
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Full Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="employee.name"
            required
            placeholder="e.g. John Doe"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Email Input -->
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Email Address</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="employee.email"
            required
            placeholder="e.g. john@example.com"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Department Input -->
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Department</label>
          <input
            type="text"
            name="department"
            [(ngModel)]="employee.department"
            placeholder="e.g. Engineering, HR, Finance"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Position Input -->
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Position / Role</label>
          <input
            type="text"
            name="position"
            [(ngModel)]="employee.position"
            placeholder="e.g. Software Engineer"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

      </div>

      <!-- Submit Controls -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
        <a routerLink="/employees" class="px-5 py-2.5 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium text-sm transition-colors">
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="loading || !empForm.form.valid"
          class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium rounded-lg text-sm transition-colors shadow-sm"
        >
          {{ loading ? 'Saving...' : (isEditMode ? 'Update Employee' : 'Save Employee') }}
        </button>
      </div>
    </form>
  </div>
</div>
