<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninja Factory - الكتالوج العام (Public Catalog)</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    
    :root {
      --primary: #2563eb;
      --secondary: #3b82f6;
      --dark: #0f172a;
      --light: #f8fafc;
      --border: #e2e8f0;
      --success: #10b981;
      --text: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--dark);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 50px;
      padding: 60px 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-bottom: 1px solid var(--border);
    }

    .product-content {
      padding: 24px;
    }

    .category-badge {
      display: inline-block;
      padding: 4px 12px;
      background: #e0f2fe;
      color: #0284c7;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .product-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .product-desc {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }
    
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background: var(--light);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark);
    }
    
    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .form-input:focus {
      border-color: var(--primary);
    }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="logo">
      🏭 Ninja Factory
    </div>
    <div class="lang-switch">
      <button class="btn btn-outline" style="border-color:white; color:white; background:transparent;" onclick="window.location.href='/'">تسجيل الدخول (ERP)</button>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>كتالوج المنتجات الصناعية</h1>
      <p>اكتشف مجموعتنا المتميزة من منتجات البلاستيك والتخريز، بجودة عالية ومواصفات عالمية</p>
    </div>

    <div id="loading" style="text-align:center; padding: 40px;">
      <h2>جاري تحميل المنتجات... ⏳</h2>
    </div>

    <div class="catalog-grid" id="catalog-grid">
      <!-- Products will be injected here via JS -->
    </div>
  </div>

  <!-- Registration / Quote Modal -->
  <div class="modal-overlay" id="reg-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">طلب تسجيل / عرض سعر</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 20px; color: #64748b;">برجاء إدخال بيانات شركتك لتقديم طلب تسجيل العميل. سيقوم قسم المبيعات بمراجعة طلبك والتواصل معك قريباً.</p>
        
        <input type="hidden" id="req-product-id">
        
        <div class="form-group">
          <label class="form-label">اسم الشركة *</label>
          <input type="text" id="req-company" class="form-input" placeholder="مثال: مصنع الأمل للبلاستيك">
        </div>
        
        <div class="form-group">
          <label class="form-label">اسم المسئول *</label>
          <input type="text" id="req-person" class="form-input" placeholder="الاسم بالكامل">
        </div>

        <div class="form-group">
          <label class="form-label">رقم الهاتف *</label>
          <input type="tel" id="req-phone" class="form-input" placeholder="01xxxxxxxxx">
        </div>

        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" id="req-email" class="form-input" placeholder="info@company.com">
        </div>

        <div class="form-group">
          <label class="form-label">الكمية المطلوبة مبدئياً</label>
          <input type="number" id="req-qty" class="form-input" placeholder="مثال: 1000">
        </div>
        
        <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="submitRequest()">إرسال الطلب (Submit)</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/public-catalog.js"></script>
</body>
</html>
