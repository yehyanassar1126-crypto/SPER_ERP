<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninja Factory - الكتالوج العام</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #00f2fe;
      --secondary: #4facfe;
      --dark-bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--dark-bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Cairo', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Tajawal', sans-serif;
    }

    header {
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--glass-border);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(to left, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      margin-bottom: 50px;
      padding: 80px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(79,172,254,0.1) 0%, transparent 60%);
      animation: rotateBg 20s linear infinite;
      z-index: -1;
    }

    @keyframes rotateBg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 900;
      margin-bottom: 15px;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Search & Filters */
    .controls-section {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 40px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 300px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 15px 45px 15px 15px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
      background: rgba(255, 255, 255, 0.1);
    }

    .search-box i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      border-color: transparent;
      box-shadow: 0 0 15px rgba(79, 172, 254, 0.4);
    }

    /* Grid & Cards */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(79, 172, 254, 0.2);
      border-color: rgba(79, 172, 254, 0.5);
    }

    .product-image-container {
      position: relative;
      width: 100%;
      height: 240px;
      overflow: hidden;
      background: #000;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
      opacity: 0.9;
    }

    .product-card:hover .product-image {
      transform: scale(1.1);
      opacity: 1;
    }

    .badge-featured {
      position: absolute;
      top: 15px;
      right: 15px;
      background: linear-gradient(45deg, #f59e0b, #ef4444);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
      z-index: 10;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .product-content {
      padding: 25px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .category-badge {
      align-self: flex-start;
      padding: 4px 12px;
      background: rgba(79, 172, 254, 0.1);
      color: var(--primary);
      border: 1px solid rgba(79, 172, 254, 0.2);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .product-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .product-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .stock-info {
      margin-bottom: 20px;
      font-size: 0.95rem;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stock-available { color: var(--success); }
    .stock-out { color: var(--danger); animation: pulse 2s infinite; }

    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Cairo', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.5);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Skeleton Loading */
    .skeleton-card {
      background: var(--card-bg);
      border-radius: 20px;
      height: 450px;
      position: relative;
      overflow: hidden;
    }
    
    .skeleton-card::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: #0b0f19;
      border: 1px solid var(--glass-border);
      width: 90%;
      max-width: 500px;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(79, 172, 254, 0.1);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .modal-header h2 {
      color: var(--text-main);
      font-size: 1.5rem;
    }

    .modal-close {
      background: rgba(255,255,255,0.1);
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: var(--danger);
      transform: rotate(90deg);
    }

    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .form-input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      outline: none;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s;
    }
    
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
      background: rgba(255, 255, 255, 0.1);
    }
    
    textarea.form-input {
      resize: vertical;
      min-height: 80px;
    }

    .selected-product-info {
      background: rgba(79, 172, 254, 0.1);
      border: 1px dashed var(--primary);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      color: white;
      font-weight: bold;
    }

    /* Floating WhatsApp */
    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 40px;
      right: 40px;
      background-color: #25d366;
      color: #FFF;
      border-radius: 50px;
      text-align: center;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s;
      animation: bounce 2s infinite;
    }
    .whatsapp-float:hover {
      transform: scale(1.1);
      background-color: #1ebe57;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-10px);}
      60% {transform: translateY(-5px);}
    }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-industry"></i> Ninja Factory
    </div>
    <div style="display:flex; align-items:center; gap:10px;" id="authArea">
      <!-- Auth UI will be injected by JS -->
      <button class="btn btn-outline" onclick="window.location.href='customer_auth.html'" style="padding:8px 16px; font-size:0.85rem;">
        <i class="fa-solid fa-user"></i> تسجيل الدخول
      </button>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>كتالوج المنتجات الصناعية</h1>
      <p>اكتشف مجموعتنا المتميزة من منتجات البلاستيك والتخريز، بجودة عالية ومواصفات عالمية تليق بطموح أعمالك.</p>
    </div>

    <div class="controls-section">
      <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن منتج، تصنيف، أو تفاصيل..." onkeyup="filterProducts()">
      </div>
      <div class="filters" id="categoryFilters">
        <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
        <button class="filter-btn" onclick="setFilter('featured', this)">🔥 المميزة</button>
        <!-- Categories will be injected here -->
      </div>
    </div>

    <div id="catalog-grid" class="catalog-grid">
      <!-- Skeleton Loaders initial state -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <!-- Registration / Quote Modal -->
  <div class="modal-overlay" id="reg-modal">
    <div class="modal">
      <div class="modal-header">
        <h2><i class="fa-solid fa-paper-plane" style="color:var(--primary)"></i> طلب تسعير أو شراء</h2>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="modal-body">
        
        <div class="selected-product-info" id="selected-product-name">
          -- اسم المنتج --
        </div>
        <div class="selected-product-info" id="client-info" style="display:none; background:rgba(16,185,129,0.1); border-color:var(--success); color:var(--success);">
        </div>
        <input type="hidden" id="req-product-id">
        <input type="hidden" id="req-product-name">
        <input type="hidden" id="req-is-warehouse">
        
        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-building"></i> اسم الشركة / العميل *</label>
          <input type="text" id="req-company" class="form-input" placeholder="أدخل اسم شركتك أو اسمك">
        </div>
        
        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-user"></i> اسم المسئول *</label>
          <input type="text" id="req-person" class="form-input" placeholder="الاسم بالكامل">
        </div>

        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-phone"></i> رقم الهاتف (يفضل واتساب) *</label>
          <input type="tel" id="req-phone" class="form-input" placeholder="01xxxxxxxxx">
        </div>

        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-cubes"></i> الكمية المطلوبة مبدئياً *</label>
          <input type="number" id="req-qty" class="form-input" placeholder="مثال: 1000">
        </div>
        
        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-comment-dots"></i> ملاحظات إضافية (اختياري)</label>
          <textarea id="req-notes" class="form-input" placeholder="أي مواصفات خاصة أو استفسارات..."></textarea>
        </div>
        
        <button class="btn btn-primary" id="submitBtn" onclick="submitRequest()" style="margin-top: 10px;">
          <i class="fa-solid fa-check-circle"></i> تأكيد وإرسال الطلب
        </button>
      </div>
    </div>
  </div>

  <!-- WhatsApp Float -->
  <a href="https://wa.me/201000000000" class="whatsapp-float" target="_blank" title="تواصل معنا واتساب">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/public-catalog.js"></script>
</body>
</html>
