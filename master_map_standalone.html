
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>NINJA SMART FACTORY ERP - ROYAL HD MASTER SYSTEM MAP</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { background:#0b132b; display:flex; justify-content:center; align-items:center; }
  </style>
</head>
<body>
  
<svg viewBox="0 0 1800 2700" width="3600" height="5400" xmlns="http://www.w3.org/2000/svg" style="background:#0b132b; font-family:'Cairo', sans-serif;">

    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>

    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>

        <feMergeNode in="coloredBlur"/>

    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Main Banner -->
  <rect x="60" y="40" width="1680" height="120" rx="20" fill="url(#headerGrad)" stroke="#60a5fa" stroke-width="4" filter="url(#glow)"/>
  <text x="900" y="95" font-weight="900" font-size="38" text-anchor="middle" fill="#ffffff">NINJA SMART TECHNOLOGY FACTORY ERP — MASTER ARCHITECTURE MAP</text>
  <text x="900" y="135" font-weight="800" font-size="20" text-anchor="middle" fill="#93c5fd">الخريطة الهندسية الكبرى المتكاملة: الربط بين الإدارات الـ 15 والدورات التشغيلية والأسهم التفاعلية و 170 جدول داتابيز</text>

  <!-- Helper function to generate a department box in SVG -->
  <!-- ROW 1 (Y: 200) -->
  <!-- Dept 1: Sales -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">1. إدارة المبيعات وخدمة العملاء (Sales & CRM)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 دورة المبيعات الشاملة (8 مراحل):</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">طلب RFQ ← عرض سعر ← أمر مبيعات ← BOM ← تحصيل خزنة ← شحن ← تسليم العميل</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 دورة المرتجعات والتسويات:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">طلب مرتجع ← فحص جودة QC ← إذن إضافة مخزني ← إشعار دائن ← تسوية</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول المبيعات: sales_orders, quotations, customers, credit_notes</text>
  </g>

  <!-- Dept 2: Procurement -->
  <g transform="translate(640, 200)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">2. إدارة المشتريات والموردين (Procurement)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 دورة الشراء الخارجي والاستلام:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">طلب احتياج PR ← عروض أسعار RFQ ← أمر شراء PO ← فحص QC ← سداد المورد</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 دورة تقييم واعتماد الموردين:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">تسجيل بيانات المورد ← تقييم سرعة التوريد والعيوب ← تصنيف المعتمد</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول المشتريات: suppliers, purchase_orders, purchase_requests</text>
  </g>

  <!-- Dept 3: Inventory -->
  <g transform="translate(1220, 200)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">3. إدارة المخازن والخامات (Inventory)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 دورة الإضافة والصرف المخزني:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">استلام خامات ← إذن إضافة ← خصم آلي للإنتاج ← حد إعادة الطلب</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 دورة الجرد الدوري والتسوية:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">فتح أمر جرد ← عَد فعلي ← مقارنة بالمستندي ← تسوية عجز/زيادة</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول المخازن: inventory_items, stock_movements, warehouses</text>
  </g>

  <path d="M 1160 350 L 1220 350" stroke="#fbbf24" stroke-width="4" marker-end="url(#arr-gold)"/>

  <path d="M 320 500 L 320 560" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr-cyan)"/>
  <path d="M 900 500 L 900 560" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr-cyan)"/>
  <path d="M 1480 500 L 1480 560" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr-cyan)"/>

  <!-- ROW 2 (Y: 560) -->
  <!-- Dept 4: Production -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">4. خطوط الإنتاج والـ BOM (Production)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 دورة أمر التشغيل والخصم الآلي:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">فتح أمر إنتاج ← خصم الخامات بحسب معايير BOM ← متابعة خط التشغيل</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 دورة استلام المنتج التام:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">إنهاء التصنيع ← فحص الجودة QC ← تحويل المنتج التام للمخازن</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول الإنتاج: bom, production_orders, finished_goods</text>
  </g>

  <!-- Dept 5: QC -->
  <g transform="translate(640, 560)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">5. ضبط الجودة والفحص المعملي (QC)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 فحص خامات المشتريات:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">سحب عينة الشحنة ← الفحص الفني المعملي ← إجازة أو رفض الشحنة</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 فحص خطوط الإنتاج والتعبئة:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">التفتيش الدوري على الخطوط ← عزل العيوب قبل التعبئة والتحميل</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول الجودة: qc_inspections, quality_standards</text>
  </g>

  <!-- Dept 6: Maintenance -->
  <g transform="translate(1220, 560)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">6. الصيانة وقطع الغيار (Maintenance)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 الصيانة الطارئة والأعطال:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">بلاغ عطل طارئ ← صرف قطعة الغيار ← الإصلاح الفني وإغلاق البلاغ</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 الصيانة الوقائية السنوية:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">تتبع ساعات التشغيل ← جدولة العمرات وتغيير الزيوت آلياً</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول الصيانة: equipment, maintenance_logs, spare_parts</text>
  </g>

  <!-- Horizontal Connected Arrows Row 2 -->
  <path d="M 580 710 L 640 710" stroke="#fbbf24" stroke-width="4" marker-end="url(#arr-gold)"/>

    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">7. الموارد البشرية والرواتب (20 HR Workflows)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 منظومة الـ 20 دورة المتكاملة:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">توظيف ← عقود ← QR حضور ← سلف أسبوعية/شهري ← جزاءات ← رواتب Pay</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 دورة التخارج وإخلاء الطرف:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">تسليم العهد الميدانية ← تصفية المستحقات ← إخلاء طرف وتجميد الحساب</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول HR: users, payroll, attendance, worker_advances</text>
  </g>

  <!-- Dept 8: Attendance QR -->
  <g transform="translate(640, 920)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">8. الحضور والبصمة الذكية (Attendance QR)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 مسح الـ QR والورديات:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">مسح كود الموبايل ← مطابقة وقت الشيفت ← حساب دقائق التأخير آلياً</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 دورة التظلمات والاعتراضات:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">تقديم تظلم تأخير ← مراجعة مدير HR ← تعديل سجل الحضور بالمسرد</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول الحضور: attendance, shifts, attendance_appeals</text>
  </g>

  <!-- Dept 9: ATS -->
  <g transform="translate(1220, 920)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">9. التوظيف الذكي ATS (Recruitment)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 الفرز السريع بالذكاء الاصطناعي:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">رفع CV PDF ← تحليل المهارات والخبرات ← استخراج نسبة المطابقة</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 المقابلة والتعيين الميداني:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">جدولة المقابلة الفنية ← تقييم اللجنة ← إصدار عرض العمل والعقد</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول التوظيف: ats_applications, job_postings</text>
  </g>

  <!-- Horizontal Connected Arrows Row 3 -->
  <path d="M 580 1070 L 640 1070" stroke="#fbbf24" stroke-width="4" marker-end="url(#arr-gold)"/>
  <path d="M 1160 1070 L 1220 1070" stroke="#fbbf24" stroke-width="4" marker-end="url(#arr-gold)"/>

  <!-- Vertical Arrows Row 3 to Row 4 -->
  <path d="M 320 1220 L 320 1280" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr-cyan)"/>
  <path d="M 900 1220 L 900 1280" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr-cyan)"/>
  <path d="M 1480 1220 L 1480 1280" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr-cyan)"/>

  <!-- ROW 4 (Y: 1280) -->
  <!-- Dept 10: General Ledger -->
  <g transform="translate(60, 1280)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">10. الإدارة المالية والقيود (Accounting)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 القيود المحاسبية التلقائية:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">إنشاء قيد آلي متوازن لكل حركة (بيع/شراء/رواتب) دون تدخل يدوي</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 الإقفال الشهري والقوائم المالية:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">ميزان المراجعة ← قائمة الدخل ← الميزانية العمومية وتقارير الضرائب</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول المالية: journal_entries, chart_of_accounts</text>
  </g>

  <!-- Dept 11: Treasury Safes -->
  <g transform="translate(640, 1280)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">11. الخزائن والبنوك (Treasury & Cash)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 الصرف والقبض النقدي:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">فحص السيولة المتاحة بالخزنة ← تنفيذ الصرف ← حظر السحب المكشوف</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 التحويلات المالية والحسابات البنكية:</text>
    <text x="20" y="185" font-weight="600" font-size="13" fill="#e2e8f0">تحويل نقدية بين الخزائن والبنوك ← اعتماد الإدارة وتوليد القيد</text>
    
    <rect x="15" y="225" width="490" height="55" rx="10" fill="#0284c7"/>
    <text x="260" y="258" font-weight="bold" font-size="13" text-anchor="middle" fill="#ffffff">🗄️ جداول الخزائن: finance_safes, bank_accounts</text>
  </g>

  <!-- Dept 12: Cost Centers -->
  <g transform="translate(1220, 1280)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#1c2541" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#1e3a8a"/>
    <text x="260" y="33" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">12. مراكز التكلفة (Cost Centers)</text>
    
    <text x="20" y="85" font-weight="800" font-size="14" fill="#38bdf8">🔄 توجيه المصروفات والرواتب:</text>
    <text x="20" y="115" font-weight="600" font-size="13" fill="#e2e8f0">تخصيص الفاتورة بكود مركز التكلفة (خط إنتاج/مشروع) آلياً</text>
    
    <text x="20" y="155" font-weight="800" font-size="14" fill="#fbbf24">🔄 تحليل ربحية الأقسام:</text>
