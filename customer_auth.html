<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة العملاء - تسجيل الدخول والإنشاء</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    
    :root {
      --primary: #2563eb;
      --secondary: #3b82f6;
      --dark: #0f172a;
      --light: #f8fafc;
      --border: #e2e8f0;
      --success: #10b981;
      --text: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-container h1 {
      color: var(--dark);
      font-size: 1.8rem;
      margin-top: 10px;
    }
    
    .logo-container p { color: #64748b; font-size: 0.9rem; }

    .tabs {
      display: flex;
      background: var(--light);
      border-radius: 10px;
      padding: 5px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #64748b;
      transition: all 0.2s;
    }

    .tab.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .form-group { margin-bottom: 16px; }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark);
      font-size: 0.9rem;
    }
    
    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .form-input:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn:hover { background: #1d4ed8; }
    
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }

    .error-msg {
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      display: none;
    }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-card">
    <div class="logo-container">
      <h1>🏭 بوابة العملاء</h1>
      <p>تسجيل الدخول أو إنشاء حساب لمتابعة طلباتك</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')" id="tab-login">تسجيل الدخول</div>
      <div class="tab" onclick="switchTab('register')" id="tab-register">إنشاء حساب جديد</div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">اسم المستخدم (البريد الإلكتروني)</label>
        <input type="text" id="log-username" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input type="password" id="log-password" class="form-input" required>
      </div>
      <button type="submit" class="btn" id="btn-login">دخول (Login)</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" onsubmit="handleRegister(event)" style="display:none">
      <div class="form-group">
        <label class="form-label">اسم الشركة / المصنع</label>
        <input type="text" id="reg-company" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">رقم الهاتف</label>
        <input type="text" id="reg-phone" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">اسم المستخدم (للدخول)</label>
        <input type="text" id="reg-username" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input type="password" id="reg-password" class="form-input" required>
      </div>
      <button type="submit" class="btn" id="btn-register">إنشاء الحساب (Register)</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    function switchTab(tab) {
      document.getElementById('error-msg').style.display = 'none';
      if (tab === 'login') {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('tab-register').classList.add('active');
      }
    }

    function showError(msg) {
      var err = document.getElementById('error-msg');
      err.textContent = msg;
      err.style.display = 'block';
    }

    function handleLogin(e) {
      e.preventDefault();
      var u = document.getElementById('log-username').value.trim();
      var p = document.getElementById('log-password').value.trim();
      
      var btn = document.getElementById('btn-login');
      btn.disabled = true; btn.innerText = 'جاري التحقق...';

      sbClient.from('suppliers').select('*').eq('email', u).single().then(function (res) {
        if (res.error || !res.data || res.data.password_hash !== p) {
          btn.disabled = false; btn.innerText = 'دخول (Login)';
          showError('اسم المستخدم أو كلمة المرور غير صحيحة');
          return;
        }

        // Success! Set session
        var userData = {
          id: res.data.id,
          supplier_id: res.data.id,
          username: res.data.email,
          full_name: res.data.company_name,
          role: 'supplier_external',
          department: 'External Supplier'
        };
        localStorage.setItem('hr_portal_user', JSON.stringify(userData));
        
        // Log history
        sbClient.from('login_history').insert({ user_id: res.data.id, user_name: res.data.company_name, login_status: 'success' }).then(function(){
            // Redirect to Portal with URL Params intact
            window.location.href = 'portal.html' + window.location.search;
        });
      });
    }

    function handleRegister(e) {
      e.preventDefault();
      var c = document.getElementById('reg-company').value.trim();
      var ph = document.getElementById('reg-phone').value.trim();
      var u = document.getElementById('reg-username').value.trim();
      var p = document.getElementById('reg-password').value.trim();

      var btn = document.getElementById('btn-register');
      btn.disabled = true; btn.innerText = 'جاري الإنشاء...';

      // Ensure no duplicate username
      sbClient.from('suppliers').select('id').eq('email', u).then(function(chk) {
        if (chk.data && chk.data.length > 0) {
           btn.disabled = false; btn.innerText = 'إنشاء الحساب (Register)';
           return showError('اسم المستخدم موجود بالفعل. اختر اسماً آخر.');
        }

        sbClient.from('suppliers').insert({
            company_name: c, email: u, password_hash: p, phone: ph, contact_person: c
        }).select().then(function(res) {
            if (res.error) {
                btn.disabled = false; btn.innerText = 'إنشاء الحساب (Register)';
                showError('حدث خطأ أثناء الإنشاء: ' + res.error.message);
                return;
            }
            
            // Auto Login after register
            var newUser = res.data[0];
            var userData = {
              id: newUser.id,
              supplier_id: newUser.id,
              username: newUser.email,
              full_name: newUser.company_name,
              role: 'supplier_external',
              department: 'External Supplier'
            };
            localStorage.setItem('hr_portal_user', JSON.stringify(userData));
            
            sbClient.from('login_history').insert({ user_id: newUser.id, user_name: newUser.company_name, login_status: 'success' }).then(function(){
                window.location.href = 'portal.html' + window.location.search;
            });
        });
      });
    }
  </script>
</body>
</html>
