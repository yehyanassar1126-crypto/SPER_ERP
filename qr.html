<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Smart Factory | QR Attendance</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236366f1'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='white' font-family='Arial'%3E🏭%3C/text%3E%3C/svg%3E">
  
  <!-- CDN: QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #131830 50%, #1a1040 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 30px;
      max-width: 500px;
      width: 100%;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .qr-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(99,102,241,0.1);
    }

    .qr-wrapper {
      display: inline-block;
      padding: 20px;
      background: #ffffff;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .timer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1rem;
      color: #94a3b8;
      margin-top: 16px;
    }

    .timer-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      border-radius: 4px;
      transition: width 1s linear;
    }

    .clock {
      font-size: 2.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }

    .date-display {
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 50px;
      color: #22c55e;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .instructions {
      color: #64748b;
      font-size: 0.78rem;
      line-height: 1.6;
      margin-top: 16px;
    }

    .footer-link {
      margin-top: 20px;
    }

    .footer-link a {
      color: #6366f1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    /* Fullscreen button */
    .fullscreen-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #94a3b8;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .fullscreen-btn:hover {
      background: rgba(99,102,241,0.2);
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

  <div class="container">
    <div class="logo">🏭</div>
    <h1>Smart Factory Attendance</h1>
    <p class="subtitle">Scan to Check-In / Check-Out (تسجيل حضور / انصراف)</p>

    <div class="clock" id="live-clock">--:--:--</div>
    <div class="date-display" id="live-date">Loading...</div>

    <div class="qr-card">
      <div class="qr-wrapper" id="qr-container"></div>
      
      <div class="status">
        <span class="status-dot"></span>
        QR Active — Refreshes every 30s
      </div>

      <div class="timer">
        <span>⏱️</span>
        <span>Next refresh in <strong id="countdown">30</strong>s</span>
      </div>
      <div class="timer-bar">
        <div class="timer-bar-fill" id="timer-fill" style="width:100%"></div>
      </div>
    </div>

    <div class="instructions">
      📱 افتح تطبيق الـ HR Portal من موبايلك<br>
      📷 اضغط Check-In أو Check-Out<br>
      🔍 وجّه الكاميرا على الـ QR Code
    </div>

    <div class="footer-link">
      <a href="portal.html">← Back to Portal</a>
    </div>
  </div>

  <script>
    // ===== LIVE CLOCK =====
    function updateClock() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('live-clock').textContent = h + ':' + m + ':' + s;
      
      var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      document.getElementById('live-date').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ===== QR CODE GENERATION =====
    var REFRESH_INTERVAL = 30; // seconds
    var countdown = REFRESH_INTERVAL;
    var qrInstance = null;

    function generateQR() {
      var container = document.getElementById('qr-container');
      container.innerHTML = '';
      
      var qrData = JSON.stringify({
        hr_id: 'qr-station',
        timestamp: Date.now(),
        type: 'hr_qr'
      });

      qrInstance = new QRCode(container, {
        text: qrData,
        width: 250,
        height: 250,
        colorDark: '#0a0e1a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      countdown = REFRESH_INTERVAL;
      document.getElementById('timer-fill').style.width = '100%';
    }

    function tickCountdown() {
      countdown--;
      document.getElementById('countdown').textContent = countdown;
      var pct = (countdown / REFRESH_INTERVAL) * 100;
      document.getElementById('timer-fill').style.width = pct + '%';
      
      if (countdown <= 0) {
        generateQR();
      }
    }

    generateQR();
    setInterval(tickCountdown, 1000);

    // ===== FULLSCREEN =====
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
